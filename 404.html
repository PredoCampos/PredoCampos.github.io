<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página não encontrada (404)</title>
    <style>
        /* Estilos mantendo o minimalismo */
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8f9fa;
            color: #343a40;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        h1 {
            font-size: 5rem; /* Número 404 bem grande */
            margin: 0;
            color: #212529;
            letter-spacing: 2px;
        }

        h2 {
            font-size: 1.5rem;
            margin-top: 0.5rem;
            margin-bottom: 1.5rem;
            font-weight: 400;
            color: #495057;
        }

        p {
            font-size: 1.1rem;
            color: #6c757d;
            margin-bottom: 2rem;
            max-width: 500px;
        }

        /* Estilo do botão de voltar */
        a.btn-voltar {
            display: inline-block;
            padding: 10px 24px;
            background-color: #343a40;
            color: #ffffff;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            transition: background-color 0.2s ease-in-out;
        }

        a.btn-voltar:hover {
            background-color: #212529;
        }
    </style>
</head>
<body>

    <h1>404</h1>
    <h2>Página não encontrada</h2>
    
    <p>Ops! Parece que você se perdeu. A página que você está tentando acessar não existe, foi movida ou o link está quebrado.</p>

    <!-- O link "/" leva o usuário de volta para a raiz do seu site (index.html) -->
    <a href="/" class="btn-voltar">Voltar para o Início</a>

</body>
</html>
