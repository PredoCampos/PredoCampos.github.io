<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Arquivo Vivo de Arte Urbana</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- O Mundo -->
  <canvas id="world"></canvas>

  <!-- Camada de Interface -->
  <div id="ui-layer">
    
    <!-- Botão de Adicionar Principal -->
    <button id="btn-add" class="fab" aria-label="Adicionar Obra">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="12" y1="5" x2="12" y2="19"></line>
        <line x1="5" y1="12" x2="19" y2="12"></line>
      </svg>
    </button>

    <!-- Painel Lateral de Submissão -->
    <aside id="sidebar" class="hidden">
      <div class="sidebar-header">
        <h2>Adicionar Obra</h2>
        <button id="btn-close-sidebar" class="icon-btn">&times;</button>
      </div>
      
      <div class="sidebar-content">
        <form id="submit-form">
          <div class="form-group">
            <label for="sticker-file">Selecione a imagem (PNG, fundo transparente)</label>
            <input type="file" id="sticker-file" accept="image/png" required>
            <div id="image-preview-container" class="hidden">
              <canvas id="preview-canvas"></canvas>
            </div>
          </div>

          <div class="form-group">
            <label for="artist-name">Nome artístico</label>
            <input type="text" id="artist-name" maxlength="60" required>
          </div>

          <div class="form-group">
            <label for="artist-handle">Usuário (ex: @artista)</label>
            <input type="text" id="artist-handle" maxlength="40">
          </div>

          <div class="form-group">
            <label for="artist-city">Cidade</label>
            <input type="text" id="artist-city" maxlength="60" required>
          </div>

          <div class="form-actions">
            <button type="button" id="btn-cancel" class="btn-secondary">Cancelar</button>
            <button type="submit" id="btn-submit" class="btn-primary" disabled>Posicionar no Muro</button>
          </div>
        </form>
      </div>
    </aside>

  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
